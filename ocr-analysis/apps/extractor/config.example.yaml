# Salin ke config.yaml lalu sesuaikan. Kredensial API tidak disimpan di sini; pakai environment variable.

input:
  max_file_mb: 50        # file lebih besar ditolak sebelum dibuka
  max_pages: 200         # dokumen dengan halaman lebih banyak ditolak

page_selection:
  economy_mode: false    # true: hanya 3 halaman pertama dan 5 terakhir yang dibuka

ocr:
  primary: tesseract
  fallback: null         # paddle belum tersedia
  tesseract_cmd: null    # path tesseract bila tidak ada di PATH; bisa juga lewat env TESSERACT_CMD
  lang: ind+eng
  scoring_dpi: 150       # OCR kasar untuk page selection
  read_dpi: 300          # OCR penuh untuk P_id dan P_ttd
  timeout_s: 60
  min_mean_conf: 0.70    # di bawah ini file masuk review (ocr_low_confidence)
  # OCR cloud mengirim gambar P_id mentah SEBELUM masking (termasuk NIK dan alamat).
  # Hanya boleh true dengan persetujuan tertulis terpisah dari client.
  cloud_fallback: false

extractor:
  # true mengirim teks P_id yang SUDAH di-mask ke LLM cloud. Butuh persetujuan kebijakan cloud dari client
  # sebelum dipakai pada data asli. false: tidak ada teks yang keluar, semua file masuk review.
  enabled: false
  # claude: Claude API bila env ANTHROPIC_API_KEY diisi (produksi); bila kosong, Claude Code CLI dengan login
  # `claude auth login` milik pengguna yang menjalankan, untuk uji lokal saja (ketentuan Anthropic: login claude.ai
  # hanya untuk pemakaian Claude Code oleh pemiliknya; layanan produksi memakai API key atau Vertex AI).
  # claude-code: selalu login Claude Code. gemini-vertex: Vertex AI saja; Google AI Studio tidak didukung.
  provider: claude        # claude | claude-code | gemini-vertex
  model: null            # null: claude-haiku-5-5 untuk claude dan claude-code; gemini-vertex wajib diisi
  max_chars_per_page: 4000
  timeout_s: 120         # per panggilan; effort max bisa berpikir cukup lama
  max_retries: 2
  effort: max            # claude dan claude-code: low | medium | high | xhigh | max
  refusal_fallback: true # claude saja, bukan Haiku: permintaan yang ditolak classifier diulang di model Claude cadangan
  vertex_project: null   # gemini-vertex; bisa juga lewat env GOOGLE_CLOUD_PROJECT
  vertex_location: null  # gemini-vertex; bisa juga lewat env GOOGLE_CLOUD_LOCATION
  claude_code_cmd: null  # claude-code; path claude.exe bila tidak di PATH; bisa juga lewat env CLAUDE_CODE_CMD

decision:
  # false: file yang semua komponennya hijau tetap masuk review (flag auto_disabled).
  # Ubah ke true hanya setelah ambang dikalibrasi di test set Fase 0.
  allow_auto: false

output:
  dir: output
  formats: [json, csv, xlsx]
  # NIK in the output files: masked (last four digits) or full. `evaluate` needs full to measure NIK accuracy.
  nik: masked
