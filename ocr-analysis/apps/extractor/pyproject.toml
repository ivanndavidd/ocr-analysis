[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-extractor"
version = "0.1.0"
description = "Ekstraksi nama karyawan, masa kontrak, dan status tanda tangan dari PDF kontrak"
requires-python = ">=3.11"
# Direct dependencies only, pinned exactly; the full resolved set lives in requirements.lock.
dependencies = [
    "pdfplumber==0.11.10",
    "pypdfium2==5.14.0",
    "numpy==2.4.6",
    "opencv-python-headless==4.14.0.94",
    "pytesseract==0.3.13",
    "pydantic==2.14.1",
    "typer==0.27.3",
    "PyYAML==6.0.3",
    "rapidfuzz==3.14.5",
    "openpyxl==3.1.5",
    "anthropic==1.13.0",
    "google-genai==2.29.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
contract-extractor = "contract_extractor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["tesseract: needs the Tesseract binary with ind+eng data (skipped when it is not installed)"]
